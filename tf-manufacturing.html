<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TF-Manufacture — Tech Foundry Power-Up</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
  :root{
    --bg:#242528; --panel:#2b2c2f;
    --subtle:rgba(255,255,255,.06); --subtle-h:rgba(255,255,255,.12);
    --line:#46474b; --text:#cecfd2; --dim:#96999e; --dimmer:#85878c;
    --head:#e2e3e5; --blue:#579dff;
  }
  [data-color-mode="light"] body:not(.tp-summary):not(.tp-connector){
    --bg:#f1f2f4; --panel:#ffffff;
    --subtle:rgba(0,0,0,.05); --subtle-h:rgba(0,0,0,.1);
    --line:#d5d7db; --text:#33373c; --dim:#6b6f76; --dimmer:#84878d;
    --head:#1d2125; --blue:#0c66e4;
  }
  *{box-sizing:border-box}
  .hidden{display:none !important}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased; line-height:1.4; padding:24px 16px;}
  body.tp-summary,body.tp-connector{padding:0;background:transparent}
  .num{font-variant-numeric:tabular-nums}
  button{font:inherit}

  .panel{max-width:720px; margin:0 auto; background:var(--panel); position:relative;
    border:none; border-radius:10px; padding:14px 18px 14px;}

  .head{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
  .title{display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:var(--head)}
  .title svg{display:block; color:var(--dim)}
  .verinline{font-weight:600; font-size:11px; color:var(--dimmer)}
  .savechip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .savechip.ok{color:var(--text)}
  .savechip.err{color:var(--head);font-weight:700;border-color:var(--head)}
  .head-right{display:flex; align-items:center; gap:12px; margin-left:auto}

  /* storage capacity meter */
  .capwrap{display:flex; flex-direction:column; gap:2px; min-width:110px}
  .capwrap .cl{display:flex; justify-content:space-between; font-size:10px; color:var(--dimmer); font-weight:600}
  .capbar{height:4px; background:var(--subtle); border-radius:999px; overflow:hidden}
  .capfill{height:100%; width:0; background:var(--dim); border-radius:999px; transition:width .3s ease}
  .capfill.warn{background:var(--text)}
  .capfill.over{background:var(--head)}

  .addbtn{appearance:none; cursor:pointer; font-weight:700; font-size:12px; white-space:nowrap;
    color:var(--blue); background:transparent; border:1px solid var(--line); border-radius:6px; padding:6px 13px}
  .addbtn:hover{background:var(--subtle)}
  .addbtn:disabled{opacity:.4; cursor:not-allowed}
  .gearbtn{appearance:none; border:0; background:transparent; cursor:pointer; color:var(--dim);
    font-size:15px; line-height:1; padding:5px 7px; border-radius:5px}
  .gearbtn:hover{color:var(--head); background:var(--subtle)}
  select.fin{appearance:none; -webkit-appearance:none; cursor:pointer;
    background-image:linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position:calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size:5px 5px; background-repeat:no-repeat; padding-right:26px}
  /* inputs backed by a datalist: draw our own chevron (the native indicator is
     hover-only and invisible on dark inputs) and keep the native one as an
     invisible full-height click target that opens the list */
  input.fin[list]{padding-right:28px;
    background-image:linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position:calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size:5px 5px; background-repeat:no-repeat}
  input.fin[list]::-webkit-calendar-picker-indicator{opacity:0; width:22px; height:100%; cursor:pointer; margin:0}
  .custrow{display:flex; align-items:center; gap:8px; padding:3px 2px; font-size:12.5px}
  .custrow .cn{font-weight:600; color:var(--head)}
  .custrow .cw{color:var(--dimmer); font-size:11.5px; margin-left:auto; white-space:nowrap}
  .custrow .icbtn{flex:0 0 auto}
  .custempty{font-size:12px; color:var(--dimmer); padding:2px}

  /* ===== note list ===== */
  .empty{font-size:12.5px; color:var(--dimmer); padding:14px 4px 8px; text-align:center}
  .note{border-top:1px solid var(--line); padding:10px 4px 11px}
  .note:first-child{border-top:none}
  .nhead{display:flex; align-items:center; gap:8px; min-width:0}
  .modchip{flex:0 0 auto; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    border-radius:4px; padding:2px 7px; color:var(--head); background:var(--subtle); border:1px solid var(--line)}
  .ntitle{font-weight:700; font-size:13.5px; color:var(--head); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .ntitle i{font-style:normal; font-weight:500; color:var(--dim)}
  .outchip{flex:0 0 auto; font-size:10.5px; font-weight:600; color:var(--dimmer); border:1px solid var(--line);
    border-radius:999px; padding:1px 8px; white-space:nowrap}
  .outchip.hi{color:var(--head); font-weight:700}
  .devflag{flex:0 0 auto; font-size:11px; font-weight:700; color:var(--head); border:1px solid var(--line);
    background:var(--subtle); border-radius:999px; padding:1px 8px; white-space:nowrap}
  .cmflag{flex:0 0 auto; color:var(--dim); display:inline-flex; align-items:center}
  .nmeta{margin-left:auto; flex:0 0 auto; font-size:11px; color:var(--dimmer); white-space:nowrap}
  .nact{display:flex; gap:2px; flex:0 0 auto}
  .icbtn{appearance:none; border:0; background:transparent; cursor:pointer; color:#6b7886;
    font-size:13px; line-height:1; padding:4px 6px; border-radius:4px}
  .icbtn:hover{color:var(--text); background:var(--subtle)}
  .icbtn.del:hover{color:var(--head); background:var(--subtle-h)}

  .nbody{margin-top:6px; display:flex; flex-direction:column; gap:4px}
  .nrow{display:flex; gap:8px; font-size:12.5px; align-items:baseline}
  .nrow .k{flex:0 0 92px; font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--dimmer); padding-top:1px}
  .nrow .v{flex:1 1 auto; min-width:0; color:var(--text); white-space:pre-wrap; word-break:break-word}
  .nrow.dev .v{color:var(--head)}
  .nrow.cmts .v{color:var(--dim); font-style:italic}
  .reqchips{display:flex; flex-wrap:wrap; gap:4px}
  .reqchip{font-size:10.5px; font-weight:600; color:var(--dim); background:var(--subtle); border-radius:999px; padding:1px 8px}

  /* ===== add/edit form ===== */
  .form{border:1px solid var(--line); background:var(--subtle); border-radius:8px;
    padding:11px 12px 12px; margin:4px 0 12px; display:flex; flex-direction:column; gap:10px}
  .form.hidden{display:none}
  .fttl{font-size:11px; font-weight:800; color:var(--blue); text-transform:uppercase; letter-spacing:.06em}
  .fgrp{display:flex; flex-direction:column; gap:5px}
  .fgrp > label{font-size:11px; font-weight:700; color:var(--dim)}
  .chips{display:flex; flex-wrap:wrap; gap:5px}
  .chipbtn{appearance:none; cursor:pointer; font-size:12px; font-weight:600; color:var(--dim);
    background:var(--subtle); border:1px solid transparent; border-radius:999px; padding:4px 12px}
  .chipbtn:hover{background:var(--subtle-h); color:var(--text)}
  .chipbtn[aria-pressed="true"]{color:var(--head); background:var(--subtle-h); border-color:var(--head)}
  .chipbtn.req[aria-pressed="true"]{color:var(--text); background:var(--subtle-h); border-color:var(--dim)}
  .frow2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .frow3{display:grid; grid-template-columns:1.1fr .8fr 1.1fr; gap:10px}
  @media (max-width:560px){ .frow2,.frow3{grid-template-columns:1fr} }
  .fin{width:100%; font:inherit; font-size:12.5px; padding:6px 9px; color:var(--text);
    background:var(--bg); border:1px solid var(--line); border-radius:5px}
  .fin::placeholder{color:var(--dimmer)}
  .fin:focus{outline:0; border-color:var(--blue)}
  textarea.fin{resize:vertical; min-height:52px; line-height:1.45}
  .devtog{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); font-weight:600; cursor:pointer; user-select:none}
  .devtog input{accent-color:var(--blue); width:14px; height:14px; cursor:pointer}
  .devtog.on{color:var(--head)}
  .cmtog{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); font-weight:600; cursor:pointer; user-select:none}
  .cmtog input{accent-color:var(--blue); width:14px; height:14px; cursor:pointer}
  .devbox{border-left:3px solid var(--dim); padding-left:9px; display:flex; flex-direction:column; gap:5px}
  .devbox.hidden{display:none}
  .oseg{display:inline-flex; background:var(--subtle); border-radius:6px; padding:2px; gap:2px; align-self:flex-start; flex-wrap:wrap}
  .oseg button{appearance:none; border:0; background:transparent; color:var(--dim); cursor:pointer;
    font-size:12px; font-weight:600; padding:4px 11px; border-radius:5px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
  .oseg button[aria-pressed="true"]{background:var(--subtle-h); color:var(--head)}
  .pullrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .pullbtn{appearance:none; cursor:pointer; font-weight:600; font-size:11.5px; white-space:nowrap;
    color:var(--dim); background:transparent; border:1px solid var(--line); border-radius:999px; padding:3px 11px}
  .pullbtn:hover{color:var(--head); background:var(--subtle)}
  .pullmsg{font-size:11.5px; color:var(--dim)}
  .pullmsg.err{color:var(--head); font-weight:600}
  .facts{display:flex; gap:8px; justify-content:flex-end; align-items:center}
  .fwarn{font-size:11px; font-weight:700; color:var(--head); margin-right:auto}
  .fwarn[hidden]{display:none}
  .fbtn{appearance:none; cursor:pointer; font-weight:700; font-size:12px; border-radius:6px; padding:7px 14px; border:0}
  .fbtn.save{background:var(--blue); color:#1d2125}
  [data-color-mode="light"] .fbtn.save{color:#fff}
  .fbtn.save:hover{filter:brightness(1.08)}
  .fbtn.save:disabled{opacity:.4; cursor:not-allowed; filter:none}
  .fbtn.cancel{background:var(--subtle); color:var(--dim)}
  .fbtn.cancel:hover{background:var(--subtle-h); color:var(--text)}


  /* ===== Trello card-back summary view ===== */
  html[data-color-mode="light"]{--mf-bg:#ffffff;--mf-text:#292a2e;--mf-subtle:#6b6e76;--mf-dimmer:#84878d;--mf-line:#dcdfe4;--mf-btn:rgba(0,0,0,.05);--mf-box:rgba(0,0,0,.035)}
  html[data-color-mode="dark"]{--mf-bg:#242528;--mf-text:#cecfd2;--mf-subtle:#96999e;--mf-dimmer:#85878c;--mf-line:#46474b;--mf-btn:rgba(255,255,255,.08);--mf-box:rgba(255,255,255,.045)}
  html{background:transparent}
  body.tp-summary{background:var(--mf-bg,transparent)}
  body.tp-summary .panel,body.tp-connector .panel{display:none}
  body.tp-connector #summaryView{display:none}
  #summaryView{display:none;padding:2px 4px 4px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #svBody{background:var(--mf-box,rgba(255,255,255,.045));border-radius:8px;padding:10px 12px}
  #svBody.nobox{background:transparent;border-radius:0;padding:3px 0 0}
  body.tp-summary #summaryView{display:block}
  body.tp-summary{overflow-y:auto;overflow-x:hidden}
  .fc-empty{font-size:12.5px;color:var(--mf-subtle,#96999e);padding:2px 0}
  .fc-note{padding:0}
  .fc-note + .fc-note{margin-top:9px; padding-top:9px; border-top:1px solid var(--mf-line,#46474b)}
  .fc-l1{display:flex;align-items:center;gap:7px;min-width:0}
  .fc-mod{flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1.5px 6px;color:var(--mf-text,#cecfd2);background:var(--mf-btn,rgba(255,255,255,.08));border:1px solid var(--mf-line,#46474b)}
  .fc-ttl{font-size:12px;font-weight:700;color:var(--mf-text,#cecfd2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .fc-ttl i{font-style:normal;font-weight:500;color:var(--mf-subtle,#96999e)}
  .fc-out{flex:0 0 auto;font-size:9.5px;font-weight:600;color:var(--mf-dimmer,#85878c);white-space:nowrap}
  .fc-out.hi{color:var(--mf-text,#cecfd2);font-weight:700}
  .fc-dev{flex:0 0 auto;font-size:10px;font-weight:800;color:var(--mf-text,#cecfd2)}
  .fc-cm{flex:0 0 auto;color:var(--mf-subtle,#96999e);display:inline-flex;align-items:center}
  .fc-by{margin-left:auto;flex:0 0 auto;font-size:10px;color:var(--mf-dimmer,#85878c);white-space:nowrap;font-variant-numeric:tabular-nums}
  .fc-snip{font-size:11px;color:var(--mf-subtle,#96999e);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;padding-left:2px}
  .fc-more{font-size:11px;color:var(--mf-dimmer,#85878c);margin-top:9px}
</style>
</head>
<body>
<div id="summaryView">
  <div id="svBody"></div>
</div>
<div class="panel">
  <div class="head">
    <span class="title">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      TF-Manufacture <span class="verinline" id="verInline"></span></span>
    <span class="savechip" id="saveChip" hidden></span>
    <div class="head-right">
      <div class="capwrap" title="Trello card storage used by this Power-Up (4 KB cap)">
        <div class="cl"><span>Card storage</span><span class="num" id="capPct">0%</span></div>
        <div class="capbar"><div class="capfill" id="capFill"></div></div>
      </div>
      <button class="gearbtn" id="gearBtn" title="Card settings" aria-label="Card settings">&#9881;&#xFE0E;</button>
      <button class="addbtn" id="addBtn">+ Add note</button>
    </div>
  </div>

  <div class="form hidden" id="form">
    <span class="fttl" id="fTtl">New manufacturing note</span>

    <div class="pullrow">
      <button type="button" class="pullbtn" id="pullBtn">&#8595;&#xFE0E; Pull from card description</button>
      <span class="pullmsg" id="pullMsg"></span>
    </div>
    <div class="fgrp hidden" id="pasteGrp">
      <label>Paste card description</label>
      <textarea class="fin" id="descPaste"></textarea>
      <div style="display:flex; gap:8px; justify-content:flex-end">
        <button type="button" class="fbtn cancel" id="pasteCancel">Cancel</button>
        <button type="button" class="fbtn save" id="pasteParse">Parse</button>
      </div>
    </div>

    <div class="fgrp">
      <label>Modality</label>
      <div class="chips" id="modChips"></div>
    </div>

    <div class="fgrp" id="pfGrp" hidden>
      <label>Platform / Technology</label>
      <div class="chips" id="pfChips"></div>
    </div>

    <div class="frow3">
      <div class="fgrp" id="matGrp">
        <label>Material</label>
        <input class="fin" id="fMat" list="matList" placeholder="Pick or type" autocomplete="off">
        <datalist id="matList"></datalist>
      </div>
      <div class="fgrp" id="varGrp">
        <label>Variant</label>
        <input class="fin" id="fVar" list="varList" placeholder="Pick or type" autocomplete="off">
        <datalist id="varList"></datalist>
      </div>
      <div class="fgrp">
        <label>Machine / equipment</label>
        <input class="fin" id="fMach" list="machList" placeholder="Pick or type" autocomplete="off">
        <datalist id="machList"></datalist>
      </div>
    </div>

    <div class="fgrp hidden" id="cutGrp" style="gap:8px">
      <div class="frow2">
        <div class="fgrp">
          <label>Offset</label>
          <input class="fin" id="fOff" list="offFitList" autocomplete="off">
          <datalist id="offFitList"></datalist>
        </div>
        <div class="fgrp">
          <label>Profile Used</label>
          <input class="fin" id="fProf">
        </div>
      </div>
      <label class="cmtog"><input type="checkbox" id="fCp"> Custom cut profile saved</label>
      <div class="fgrp" id="cpnGrp" hidden>
        <label>Profile name (optional)</label>
        <input class="fin" id="fCpn">
      </div>
    </div>

    <div class="fgrp">
      <label>Process settings / parameters</label>
      <input class="fin" id="fSet">
    </div>

    <div class="fgrp">
      <label>Client-defined requirements</label>
      <div class="chips" id="reqChips"></div>
      <input class="fin" id="fReqx" aria-label="Requirement detail" hidden>
    </div>

    <div class="fgrp">
      <label class="devtog" id="devTog"><input type="checkbox" id="fDev"> Deviation from SOP</label>
      <div class="devbox hidden" id="devBox">
        <textarea class="fin" id="fDevx"></textarea>
      </div>
    </div>

    <div class="frow2">
      <div class="fgrp">
        <label>Outcome</label>
        <div class="oseg" id="oSeg"></div>
      </div>
      <div class="fgrp">
        <label>Location</label>
        <div class="oseg" id="locSeg"></div>
      </div>
    </div>

    <div class="fgrp">
      <label>Notes</label>
      <textarea class="fin" id="fNote"></textarea>
    </div>

    <div class="fgrp">
      <label class="cmtog"><input type="checkbox" id="fCm"> Additional context provided in comments</label>
    </div>

    <div class="facts">
      <span class="fwarn" id="fWarn" hidden></span>
      <button class="fbtn cancel" id="fCancel">Cancel</button>
      <button class="fbtn save" id="fSave">Save note</button>
    </div>
  </div>

  <div class="form hidden" id="settings">
    <span class="fttl">Card settings</span>

    <div class="fgrp">
      <label>Custom materials on this card</label>
      <div id="custList"></div>
    </div>

    <div class="frow3">
      <div class="fgrp">
        <label>Material name</label>
        <input class="fin" id="cMatName">
      </div>
      <div class="fgrp">
        <label>Modality</label>
        <select class="fin" id="cMod"></select>
      </div>
      <div class="fgrp">
        <label>Platform</label>
        <select class="fin" id="cPf"></select>
      </div>
    </div>

    <div class="facts">
      <span class="fwarn" id="sWarn" hidden></span>
      <button class="fbtn cancel" id="sClose">Close</button>
      <button class="fbtn save" id="cAdd">Add material</button>
    </div>
  </div>

  <div id="list"></div>
</div>

<script>
/* ============================================================================
   TF-Manufacturing — internal manufacturing documentation Power-Up
   Same four-mode chassis as Recharge / TF-Message:
   - connector  : hidden iframe Trello loads for every card (no ?view=)
   - summary    : compact read-only view on the card back (?view=summary)
   - editor     : the full tool in a pop-out modal (?view=editor)
   - standalone : file opened directly in a browser -> full tool (browser-local persistence)
============================================================================ */
var SELF = location.origin + location.pathname;
var VERSION = '2.2';
var _t = null, _ready = false, _saveTimer = null, _sim = false;
var TRELLO_ICON = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>');

function getParam(n){ try{ return new URLSearchParams(location.search).get(n); }catch(e){ return null; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ----- capability catalog (Tech Foundry — Davis & Aggie Square) -----------
   Materials may be plain strings or {n:'Family', v:['Variant', ...]}.
   Machine home locations feed the location auto-fill (Prusa XL and the
   Form 4B/4BL fleets live at both sites, so they don't auto-fill).        */
var MACH_MATS = ['Aluminum','Steel','Stainless Steel','Brass','Copper','Titanium',
  'Delrin (POM)','Acrylic (PMMA)','Nylon','PTFE (Teflon)','Polycarbonate','HDPE','UHMW','PEEK','FR4 / Garolite'];
var FDM_MATS = [
  {n:'PLA', v:['White','Black']}, {n:'PETG', v:['Translucent','White','Black']},
  'ABS','ASA','TPU',{n:'PA (Nylon)'},'PC','PET',
  {n:'CF ABS', v:['White','Black']},'CF Nylon','CF PLA','CF PETG',
  'PVA (water-soluble)','HIPS','PEEK','PEI (Ultem)','ASA (White) + SR-30 support'];

var MODS = [
  { id:'print', name:'3D Printing', abbr:'3DP', platforms:[

function pfOf(mod,id){ if(!mod) return null; for(var i=0;i<(mod.platforms||[]).length;i++) if(mod.platforms[i].id===id) return mod.platforms[i]; return null; }
function outOf(id){ for(var i=0;i<OUTS.length;i++) if(OUTS[i].id===id) return OUTS[i]; return OUTS[0]; }
function reqName(id){ for(var i=0;i<REQS.length;i++) if(REQS[i].id===id) return REQS[i].name; return id; }
function matName(m){ return (typeof m==='string') ? m : m.n; }
function matVars(m){ return (typeof m==='object' && Array.isArray(m.v)) ? m.v : []; }

/* ----- state & persistence ------------------------------------------------
   Trello caps a plugin's card data at 4096 chars total (shared scope).
   Notes are stored with compact keys; the meter shows usage and saving is
   refused (never silently truncated) once the cap would be exceeded.       */
var MAX_BYTES = 3980;
var state = { notes: [], custom: [] };   // notes newest first; custom = per-card materials {n, m, p}

function packNote(n){
  var c = { i:n.i, t:n.t, by:n.by, m:n.m, p:n.p, mt:n.mt, vr:n.vr, mc:n.mc, st:n.st,
            of:n.of||undefined, pr:n.pr||undefined, cp:n.cp?1:undefined, cpn:n.cpn||undefined,
            rq:(n.rq&&n.rq.length)?n.rq:undefined, rx:n.rx||undefined,
            dv:n.dv?1:undefined, dx:n.dx||undefined, o:n.o,
            lc:n.lc||undefined, cm:n.cm?1:undefined, nt:n.nt||undefined };
  Object.keys(c).forEach(function(k){ if(c[k]===undefined || c[k]==='') delete c[k]; });
  return c;
}
function serializeState(){
  var d = { v:1, n:state.notes.map(packNote) };
  if(state.custom.length) d.cmats = state.custom.map(function(c){ return { n:c.n, m:c.m, p:c.p||undefined }; });
  return d;
}
function payloadBytes(candidate){
  try{ return JSON.stringify({ mfg:(candidate||serializeState()) }).length; }catch(e){ return 0; }
}
function hydrateState(d){
  if(!d || typeof d!=='object' || !Array.isArray(d.n)) return false;
  state.custom = Array.isArray(d.cmats) ? d.cmats.map(function(c){
    return { n:c.n||'', m:c.m||'other', p:c.p||'' };
  }).filter(function(c){ return c.n; }) : [];
  state.notes = d.n.map(function(e){
    return { i:e.i||String(Math.random()).slice(2,8), t:e.t||0, by:e.by||'', m:e.m||'other', p:e.p||'',
             mt:e.mt||'', vr:e.vr||'', mc:e.mc||'', st:e.st||'',
             of:e.of||'', pr:e.pr||'', cp:!!e.cp, cpn:e.cpn||'',
             rq:Array.isArray(e.rq)?e.rq:[], rx:e.rx||'',
             dv:!!e.dv, dx:e.dx||'', o:e.o||'wip', lc:e.lc||'', cm:!!e.cm, nt:e.nt||'' };
  });
  return true;
}
function savePayload(){ return { mfg: serializeState() }; }

var SAVE_DELAY = 800, _edBC = null, _connBC = null, _lastCardT = null;
function saveChip(txt, cls){
  var c = document.getElementById('saveChip'); if(!c) return;
  if(!txt){ c.hidden = true; return; }
  c.hidden = false; c.textContent = txt; c.className = 'savechip' + (cls ? ' ' + cls : '');
}
function saveNow(){
  clearTimeout(_saveTimer); _saveTimer = null;
  if(_sim){ try{ localStorage.setItem('tf-manufacturing-local', JSON.stringify(serializeState())); saveChip('Saved \u2713','ok'); setTimeout(function(){ saveChip(''); },2000); }catch(e){} return; }
  if(!_t) return;
  try{
    var p = _t.set('card','shared', savePayload());
    saveChip('Saving\u2026');
    if(p && p.then){
      p.then(function(){ saveChip('Saved \u2713','ok'); setTimeout(function(){ saveChip(''); }, 2500); },
             function(){ saveChip('Save failed','err'); });
    } else { saveChip('Saved \u2713','ok'); setTimeout(function(){ saveChip(''); }, 2500); }
  }catch(e){ saveChip('Save failed','err'); }
}
function saveCard(){
  if(!_ready) return;
  clearTimeout(_saveTimer);
  saveChip('Saving\u2026');
  _saveTimer = setTimeout(saveNow, SAVE_DELAY);
}
/* Close-proof saving: on any sign the modal is going away, fire the direct
   save AND relay a copy to the connector over BroadcastChannel — the
   connector outlives this iframe and performs the same t.set from safety.
   Duplicate writes are idempotent. */
function relayFlush(){
  try{
    if(!_edBC) _edBC = new BroadcastChannel('tf-mfg');
    _edBC.postMessage({ type:'save', data: savePayload() });
  }catch(e){}
}
['pagehide','beforeunload'].forEach(function(ev){
  window.addEventListener(ev, function(){ if(_saveTimer){ relayFlush(); saveNow(); } });
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden' && _saveTimer){ relayFlush(); saveNow(); }
});
function loadCard(cb){
  if(_sim){
    try{ var raw = localStorage.getItem('tf-manufacturing-local'); if(raw) hydrateState(JSON.parse(raw)); }catch(e){}
    cb && cb(true); return;
  }
  if(!_t){ cb && cb(false); return; }
  var done=false, finish=function(ok){ if(done) return; done=true; cb && cb(ok); };
  try{
    var pd = _t.get('card','shared','mfg');
    if(pd && pd.then){
      pd.then(function(d){ finish(hydrateState(d)); }, function(){ finish(false); });
    } else finish(false);
  }catch(e){ finish(false); }
}

function fmtDate(t){
  if(!t) return '';
  var d = new Date(t);
  return (d.getMonth()+1) + '/' + d.getDate() + '/' + String(d.getFullYear()).slice(2);
}
function noteTitle(n){
  var mod = modOf(n.m), pf = pfOf(mod, n.p);
  var bits = [];
  if(pf) bits.push(pf.name); else if(n.p) bits.push(n.p);
  if(n.mt) bits.push(n.mt + (n.vr ? ' \u00b7 ' + n.vr : ''));
  else if(n.vr) bits.push(n.vr);
  return bits.join(' \u00b7 ');
}
function noteMeta(n){
  var bits = [];
  var l = locShort(n.lc); if(l) bits.push(l);
  if(n.by) bits.push(n.by);
  if(n.t) bits.push(fmtDate(n.t));
  return bits.join(' \u00b7 ');
}
function updateCap(){
  var b = payloadBytes(), pct = Math.round(b / MAX_BYTES * 100);
  $('capPct').textContent = Math.min(999,pct) + '%';
  var f = $('capFill');
  f.style.width = Math.min(100,pct) + '%';
  f.className = 'capfill' + (pct>100?' over':(pct>85?' warn':''));
}

function renderList(){
  var el = $('list');
  if(!state.notes.length){
    el.innerHTML = '<div class="empty">No manufacturing notes yet. Add one to document how this job was made.</div>';
    updateCap(); return;
  }
  var h = '';
  state.notes.forEach(function(n){
    var mod = modOf(n.m) || modOf('other');
    var out = outOf(n.o);
    h += '<div class="note" data-id="' + esc(n.i) + '">';
    h += '<div class="nhead">';
    h += '<span class="modchip">' + esc(mod.abbr) + '</span>';
    h += '<span class="ntitle">' + esc(noteTitle(n) || mod.name) + (n.mc ? ' <i>\u2014 ' + esc(n.mc) + '</i>' : '') + '</span>';
    h += '<span class="outchip' + (out.hi ? ' hi' : '') + '">' + esc(out.name) + '</span>';
    if(n.dv) h += '<span class="devflag">\u26a0\ufe0e SOP deviation</span>';
    if(n.cm) h += '<span class="cmflag" title="Additional context provided in comments"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>';
    h += '<span class="nmeta num">' + esc(noteMeta(n)) + '</span>';
    h += '<span class="nact"><button class="icbtn edit" title="Edit">\u270e</button><button class="icbtn del" title="Delete">\u2715</button></span>';
    h += '</div>';
    var body = '';
    if(n.st) body += '<div class="nrow"><span class="k">Settings</span><span class="v">' + esc(n.st) + '</span></div>';
    if(n.of) body += '<div class="nrow"><span class="k">Offset</span><span class="v">' + esc(n.of) + '</span></div>';
    if(n.pr || n.cp){
      var pv = esc(n.pr || '');
      if(n.cp) pv += (pv ? ' \u2014 ' : '') + 'custom profile saved' + (n.cpn ? ' as \u201c' + esc(n.cpn) + '\u201d' : '');
      body += '<div class="nrow"><span class="k">Profile</span><span class="v">' + pv + '</span></div>';
    }
    if(n.rq && n.rq.length){
      body += '<div class="nrow"><span class="k">Client reqs</span><span class="v"><span class="reqchips">' +
        n.rq.map(function(r){ return '<span class="reqchip">' + esc(reqName(r)) + '</span>'; }).join('') +
        '</span>' + (n.rx ? '<div style="margin-top:3px">' + esc(n.rx) + '</div>' : '') + '</span></div>';
    }
    if(n.dv && n.dx) body += '<div class="nrow dev"><span class="k">Deviation</span><span class="v">' + esc(n.dx) + '</span></div>';
    if(n.nt) body += '<div class="nrow"><span class="k">Notes</span><span class="v">' + esc(n.nt) + '</span></div>';
    if(n.cm) body += '<div class="nrow cmts"><span class="k">Comments</span><span class="v">Additional context provided in card comments</span></div>';
    if(body) h += '<div class="nbody">' + body + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('.note').forEach(function(nd){
    var id = nd.getAttribute('data-id');
    nd.querySelector('.edit').addEventListener('click', function(){ openForm(id); });
    nd.querySelector('.del').addEventListener('click', function(){
      var i = state.notes.findIndex(function(x){ return x.i===id; });
      if(i<0) return;
      var n = state.notes[i];
      if(!confirm('Delete this note? (' + (noteTitle(n)||modOf(n.m).name) + ')')) return;
      state.notes.splice(i,1);
      renderList(); saveCard();
    });
  });
  updateCap();
}

function chipRow(container, items, selectedId, onPick, cls){
  container.innerHTML = '';
  items.forEach(function(it){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chipbtn' + (cls?' '+cls:'');
    b.textContent = it.name;
    b.setAttribute('aria-pressed', String(selectedId===it.id));
    b.addEventListener('click', function(){ onPick(it.id); });
    container.appendChild(b);
  });
}
function renderModChips(){
  chipRow($('modChips'), MODS, form.m, function(id){
    form.m = id; form.p = null;
    renderModChips(); renderPfChips(); refreshMats(); refreshVars(); refreshMachs(); updateFieldVis();
  });
}
function renderPfChips(){
  var mod = modOf(form.m);
  var grp = $('pfGrp');
  if(!mod || !(mod.platforms||[]).length){ grp.hidden = true; return; }
  grp.hidden = false;
  chipRow($('pfChips'), mod.platforms, form.p, function(id){
    form.p = id;
    renderPfChips(); refreshMats(); refreshVars(); refreshMachs();
  });
}
function currentMats(){
  var mod = modOf(form.m), pf = pfOf(mod, form.p);
  var mats = (pf && pf.mats) ? pf.mats.slice() : [];
  if(!mats.length && mod){
    (mod.platforms||[]).forEach(function(p){
      (p.mats||[]).forEach(function(m){
        if(!mats.some(function(x){ return matName(x)===matName(m); })) mats.push(m);
      });
    });
  }
  /* card-defined materials: match modality, and platform when one is set */
  state.custom.forEach(function(c){
    if(c.m !== form.m) return;
    if(c.p && form.p && c.p !== form.p) return;
    if(!mats.some(function(x){ return matName(x)===c.n; })) mats.push(c.n);
  });
  return mats;
}
function refreshMats(){
  var dl = $('matList'); dl.innerHTML = '';
  currentMats().forEach(function(m){ var o = document.createElement('option'); o.value = matName(m); dl.appendChild(o); });
}
function refreshVars(){
  var dl = $('varList'); dl.innerHTML = '';
  var typed = $('fMat').value.trim().toLowerCase();
  var vars = [];
  currentMats().forEach(function(m){
    if(matName(m).toLowerCase() === typed) vars = matVars(m);
  });
  vars.forEach(function(v){ var o = document.createElement('option'); o.value = v; dl.appendChild(o); });
}
function refreshMachs(){
  var dl = $('machList'); dl.innerHTML = '';
  var mod = modOf(form.m), pf = pfOf(mod, form.p);
  var machs = (pf && pf.mach) ? pf.mach.slice() : [];
  if(!machs.length && mod){
    (mod.platforms||[]).forEach(function(p){
      (p.mach||[]).forEach(function(m){ if(machs.indexOf(m)<0) machs.push(m); });
    });
  }
  machs.forEach(function(m){ var o = document.createElement('option'); o.value = m; dl.appendChild(o); });
}
function renderReqChips(){
  var c = $('reqChips'); c.innerHTML = '';
  REQS.forEach(function(r){
    var b = document.createElement('button');
    b.type='button'; b.className='chipbtn req';
    b.textContent = r.name;
    b.setAttribute('aria-pressed', String(form.rq.indexOf(r.id)>=0));
    b.addEventListener('click', function(){
      var i = form.rq.indexOf(r.id);
      if(i>=0) form.rq.splice(i,1); else form.rq.push(r.id);
      renderReqChips();
      $('fReqx').hidden = !form.rq.length;
    });
    c.appendChild(b);
  });
  $('fReqx').hidden = !form.rq.length;
}

/* --- pull manufacturing details from the card description ----------------
   Client intake compiles a structured block into the card description.
   Values are sliced between known field labels after flattening the
   markdown to plain run-on text. Not every card has the block.          */
var DESC_LABELS = [
  'Collection/Delivery Preference:','Social Media Status:','Social Media approval:',
  'Client Details:','Expanded Client Details:','Client Phone:','Client Email:','Secondary Contacts:',
  'Physician Email (bolus only):','Physician Email:','Department:','PI:','Project Billing:','Aggie Enterprise:',
  'Action and Budget:','Authorization','Max Budget:','Target Completion Date','Date of Request',
  'General Service Details:','ID ','Client Description:','Services:','Materials Furnished By:',
  '3D Printing Expanded Details:','Selection Strategy:','Method:','Desired Printing Technology:','Desired 3D Printing Technology:',
  'Client Defined Material','FDM Material:','Reinforced FDM Materials:','Polyjet Materials:',
  'Stereolithograpy Materials:','Stereolithography Materials:','Microfluidics Printer Materials:',
  'Desired Consultation:','Characteristics','All Important Features:','Color/Opacity:','Mechanical:',
  'Resolution:','Resistance:','Biocompatibility:','Cost:','Other Considerations:',
  'Unassisted Use Details:','Reporting Unassisted Use:','Clinical Details',
  'Use Case of Uploaded Structures','Purchasing Snippet:','Supplies for internal recharge','Recharge information:'
];
function flattenDesc(txt){
  return String(txt||'')
    .replace(/\[([^\]]*)\]\([^\)]*\)/g, '$1')   /* markdown links -> text */
    .replace(/\\([\\`*_{}\[\]()#+\-.!<>])/g, '$1')  /* markdown escapes */
    .replace(/[*_#>`]/g, '')                      /* markdown tokens */
    .replace(/\s+/g, ' ');
}
function labelRe(label){
  var e = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
  return new RegExp('(^|[\\s.,;:)\\]])(' + e + ')', 'i');   /* word-start anchored */
}
var _descBnds = null;
function descGrab(flat, label){
  var m = labelRe(label).exec(flat);
  if(!m) return null;
  var start = m.index + m[0].length;
  var end = flat.length;
  if(!_descBnds) _descBnds = DESC_LABELS.map(labelRe);
  var rest = flat.slice(start);
  for(var k=0; k<_descBnds.length; k++){
    var mm = _descBnds[k].exec(rest);
    if(mm){
      var pos = start + mm.index + mm[1].length;
      if(pos < end) end = pos;
    }
  }
  var v = flat.slice(start, end);
  v = v.replace(/^[\s:\-\u2013,]+/,'').replace(/[\s\-\u2013,]+$/,'').trim();
  return v || null;
}
var SERVICE_TO_MOD = [
  ['3d printing','print'], ['laser','laser'], ['machining','mach'], ['waterjet','wjet'],
  ['sheet metal','sheet'], ['vacuum forming','vac'], ['vinyl','blade'],
  ['casting','cast'], ['roto-casting','cast'], ['injection molding','cast'],
  ['composites','comp'], ['3d scanning','scan'], ['imaging data reconstruction','dicom'],
  ['dicom','dicom'], ['medical bolus','bolus'], ['pcb','pcb'],
  ['general development','other'], ['cad','other']
];
var TECH_TO_PF = [
  ['carbon fiber','cffdm'], ['reinforced fdm','cffdm'],
  ['multijet','mjf'], ['mjf','mjf'],
  ['stereolithography','sla'], ['sla','sla'],
  ['polyjet','polyjet'],
  ['microfluidic','micro'],
  ['fdm','fdm'], ['fff','fdm']
];
var MAT_FIELDS = [
  ['fdm','FDM Material:'], ['cffdm','Reinforced FDM Materials:'], ['polyjet','Polyjet Materials:'],
  ['sla','Stereolithograpy Materials:'], ['sla','Stereolithography Materials:'],
  ['micro','Microfluidics Printer Materials:']
];
function parseDesc(txt){
  var flat = flattenDesc(txt);
  if(!flat.trim()) return null;
  var out = { found:false };
  var services = descGrab(flat, 'Services:');
  if(services){
    var sl = services.toLowerCase();
    for(var i=0; i<SERVICE_TO_MOD.length; i++){
      if(sl.indexOf(SERVICE_TO_MOD[i][0]) >= 0){ out.m = SERVICE_TO_MOD[i][1]; out.found = true; break; }
    }
  }
  var tech = descGrab(flat, 'Desired Printing Technology:') || descGrab(flat, 'Desired 3D Printing Technology:');
  if(tech && (!out.m || out.m === 'print')){
    var tl = tech.toLowerCase();
    for(var j=0; j<TECH_TO_PF.length; j++){
      if(tl.indexOf(TECH_TO_PF[j][0]) >= 0){
        out.p = TECH_TO_PF[j][1];
        out.m = out.m || 'print';   /* a printing technology implies the modality */
        out.found = true; break;
      }
    }
  }
  /* material preference: prefer the field matching the platform, else the
     first non-empty one (and let it imply the platform) */
  var matched = null, first = null;
  for(var f=0; f<MAT_FIELDS.length; f++){
    var mv = descGrab(flat, MAT_FIELDS[f][1]);
    if(!mv) continue;
    if(!first) first = { pf:MAT_FIELDS[f][0], v:mv };
    if(out.p && MAT_FIELDS[f][0] === out.p && !matched) matched = { pf:MAT_FIELDS[f][0], v:mv };
  }
  var pick = matched || first;
  if(pick && (!out.m || out.m === 'print')){
    out.mt = pick.v;
    if(!out.p){ out.p = pick.pf; }
    out.m = out.m || 'print';
    out.found = true;
  }
  var reqMap = [ ['Color/Opacity:','col'], ['Mechanical:','mech'], ['Resolution:','res'],
                 ['Resistance:','env'], ['Biocompatibility:','bio'], ['Cost:','cost'] ];
  out.rq = []; var det = [];
  reqMap.forEach(function(rm){
    var v = descGrab(flat, rm[0]);
    if(v){ out.rq.push(rm[1]); det.push(rm[0].replace(':','') + ': ' + v); out.found = true; }
  });
  var feats = descGrab(flat, 'All Important Features:');
  if(feats){ det.unshift('Features: ' + feats); out.found = true; }
  if(det.length) out.rx = det.join(' \u00b7 ');
  var coll = descGrab(flat, 'Collection/Delivery Preference:');
  if(coll){
    var cl = coll.toLowerCase();
    if(cl.indexOf('davis') >= 0){ out.lc = 'davis'; out.found = true; }
    else if(cl.indexOf('aggie square') >= 0 || cl.indexOf('sacramento') >= 0){ out.lc = 'as'; out.found = true; }
  }
  return out.found ? out : null;
}
function applyParsed(p){
  var got = [];
  if(p.m){ form.m = p.m; form.p = p.p || null; got.push(modOf(p.m).name + (p.p && pfOf(modOf(p.m), p.p) ? ' \u00b7 ' + pfOf(modOf(p.m), p.p).name : '')); }
  renderModChips(); renderPfChips(); refreshMats(); refreshVars(); refreshMachs(); updateFieldVis();
  if(p.mt){ $('fMat').value = p.mt; refreshVars(); got.push('material preference'); }
  if(p.rq && p.rq.length){
    form.rq = p.rq.slice(); renderReqChips();
    if(p.rx) $('fReqx').value = p.rx;
    got.push(p.rq.length + ' requirement' + (p.rq.length>1?'s':''));
  }
  if(p.lc){ form.lc = p.lc; renderLocSeg(); got.push(locName(p.lc)); }
  return got;
}
function pullMsg(txt, err){

function runParse(txt){
  var p = parseDesc(txt);

var FC_MAX = 6;
function renderSummary(){
  var body = document.getElementById('svBody'); if(!body) return;
  if(!state.notes.length){
    body.classList.add('nobox');
    body.innerHTML = '<div class="fc-empty">No manufacturing notes</div>'; return;
  }
  body.classList.remove('nobox');
  var h = '';
  state.notes.slice(0, FC_MAX).forEach(function(n){
    var mod = modOf(n.m) || modOf('other');
    var out = outOf(n.o);
    h += '<div class="fc-note"><div class="fc-l1">';
    h += '<span class="fc-mod">' + esc(mod.abbr) + '</span>';
    h += '<span class="fc-ttl">' + esc(noteTitle(n) || mod.name) + (n.mc ? ' <i>\u2014 ' + esc(n.mc) + '</i>' : '') + '</span>';
    h += '<span class="fc-out' + (out.hi ? ' hi' : '') + '">' + esc(out.name) + '</span>';
    if(n.dv) h += '<span class="fc-dev" title="SOP deviation">\u26a0\ufe0e</span>';
    if(n.cm) h += '<span class="fc-cm" title="Additional context in comments"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>';
    h += '<span class="fc-by">' + esc(noteMeta(n)) + '</span>';
    h += '</div>';
    var snip = n.nt || n.st || n.dx || '';
    if(snip) h += '<div class="fc-snip">' + esc(snip.length>110 ? snip.slice(0,110)+'\u2026' : snip) + '</div>';
    h += '</div>';
  });
  if(state.notes.length > FC_MAX)
    h += '<div class="fc-more">+ ' + (state.notes.length - FC_MAX) + ' more \u2014 open to view</div>';
  body.innerHTML = h;
}
function estimateFaceHeight(d){
  var n = 0, snips = 0;
  try{
    if(d && Array.isArray(d.n)){
      n = Math.min(d.n.length, FC_MAX);
      d.n.slice(0, FC_MAX).forEach(function(e){ if(e.nt || e.st || e.dx) snips++; });
    }
  }catch(e){}
  if(!n) return 44;
  var h = 40 + n*20 + (n-1)*19 + snips*17;
  if(d.n.length > FC_MAX) h += 24;
  return Math.min(560, h);
}

/* ----- Trello wiring ------------------------------------------------------ */
function initConnector(){
  try{
    _connBC = new BroadcastChannel('tf-mfg');
    _connBC.onmessage = function(m){
      var msg = m && m.data;
      if(!msg || msg.type !== 'save' || !_lastCardT) return;
      try{
        _lastCardT.set('card','shared', msg.data).then(
          function(){ try{ _connBC.postMessage({type:'saved'}); }catch(e){} },
          function(){ try{ _connBC.postMessage({type:'saveerr'}); }catch(e){} }
        );
      }catch(e){ try{ _connBC.postMessage({type:'saveerr'}); }catch(_){}}
    };
  }catch(e){}
  window.TrelloPowerUp.initialize({
    'card-back-section': function(t, opts){
      _lastCardT = t;
      var buildSection = function(dataStr){
        var d = null; try{ d = dataStr ? JSON.parse(dataStr) : null; }catch(e){}
        var url = SELF + '?view=summary&cb=' + Date.now() + '&d=' + encodeURIComponent(dataStr);
        try{ if(t.signUrl) url = t.signUrl(url); }catch(e){}   // signed URLs authenticate the iframe's Trello channel
        return {
          title: 'TF-Manufacture v' + VERSION,
          icon: TRELLO_ICON,
          content: { type:'iframe', url: url, height: estimateFaceHeight(d) },
          action: { text: 'Open', callback: function(tt){
            return tt.modal({ url: SELF + '?view=editor&cb=' + Date.now(), fullscreen: false, height: 1100, title: '', accentColor: '#242528' });
          } }
        };
      };
      var read = t.get('card','shared','mfg')
        .then(function(d){ return d ? JSON.stringify(d) : ''; })
        .catch(function(){ return ''; });
      var timeout = new Promise(function(res){ setTimeout(function(){ res(''); }, 1500); });
      return Promise.race([read, timeout]).then(buildSection);
    }
  });
}

function detectTheme(t){
  try{ var c=t.getContext&&t.getContext(); if(c&&(c.theme==='dark'||c.theme==='light')) return {theme:c.theme,src:'ctx'}; }catch(e){}
  var a=document.documentElement.getAttribute('data-color-mode'); if(a==='dark'||a==='light') return {theme:a,src:'attr'};
  return {theme:'dark',src:'default'};
}
function applyTheme(t){
  var d = detectTheme(t);
  document.documentElement.setAttribute('data-color-mode', d.theme);
  return d;
}

function initSummary(){
  var t = window.TrelloPowerUp.iframe();
  _t = window._t = t;
  applyTheme(t);
  [150,500,1200,2500].forEach(function(ms){ setTimeout(function(){ applyTheme(t); }, ms); });
  var settled = false;
  var finish = function(){
    if(settled) return; settled = true;
    applyTheme(t); renderSummary();
    try{ if(t.sizeTo) t.sizeTo('#summaryView'); }catch(_){}
  };
  var tryGet = function(){
    if(settled) return;
    try{
      var p = t.get('card','shared','mfg');
      if(p && p.then){
        p.then(function(d){ hydrateState(d); finish(); }, function(){ finish(); });
      } else { finish(); }
    }catch(er){}
  };
  /* Primary path: data delivered by the connector in the URL — no round-trip. */
  var dParam = getParam('d');
  if(dParam !== null){
    if(dParam === ''){ finish(); }
    else {
      try{ hydrateState(JSON.parse(dParam)); finish(); }
      catch(er){ /* malformed — fall through to Trello paths */ }
    }
  }
  [400,1000,2000].forEach(function(ms){ setTimeout(function(){ try{ if(t.sizeTo) t.sizeTo('#summaryView'); }catch(_){} }, ms); });
  try{ t.render(function(){ applyTheme(t); tryGet(); }); }catch(err){}
  setTimeout(function(){ tryGet(); }, 600);
  setTimeout(function(){ finish(); }, 3500);
}

var _memberTag = null;
function memberTagFrom(m){
  var n = ((m && (m.fullName || m.username)) || '').trim();
  if(!n) return null;
  var parts = n.split(/\s+/);
  if(parts.length === 1) return parts[0];
  return parts[0] + ' ' + parts[parts.length-1].charAt(0).toUpperCase() + '.';
}
function initEditor(){
  try{ _t = window._t = window.TrelloPowerUp.iframe(); }catch(e){ _t=null; }
  applyTheme(_t);
  [150,500,1500].forEach(function(ms){ setTimeout(function(){ applyTheme(_t); }, ms); });
  try{
    var pm = _t && _t.member ? _t.member('fullName','username') : null;
    if(pm && pm.then) pm.then(function(m){ _memberTag = memberTagFrom(m); }, function(){});
  }catch(e){}
  setTimeout(function(){ try{ document.body.setAttribute('tabindex','-1'); document.body.focus({preventScroll:true}); }catch(e){} }, 120);
  loadCard(function(){ initFullApp(); });
}

function boot(){
  var view = getParam('view');
  var framed = (window.self !== window.top);
  var hasTrello = (typeof window.TrelloPowerUp !== 'undefined');
  var vb = document.getElementById('verInline'); if(vb) vb.textContent = 'v' + VERSION;
  if(hasTrello && framed && view==='summary'){ document.body.classList.add('tp-summary'); initSummary(); }
  else if(hasTrello && framed && view==='editor'){ initEditor(); }
  else if(hasTrello && framed && !view){ document.body.classList.add('tp-connector'); initConnector(); }
  else { _sim = true; loadCard(function(){ initFullApp(); }); }
}
boot();
